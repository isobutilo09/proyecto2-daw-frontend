<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | GarageHub</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/modal.js" defer></script>
  <script src="../js/validacion.js" defer></script>
</head>
<body>
  <div class="auth">
    <aside class="auth-hero">
      <a class="logo" href="../index.html"><span aria-hidden="true">G</span>Garage<b>Hub</b></a>
      <div>
        <h2>Tu coche. <em>Tu historia.</em></h2>
        <p class="muted">Cada kilómetro cuenta. Guarda tus vehículos, su mantenimiento y todo lo que les hace únicos.</p>
      </div>
    </aside>
    <main class="auth-form">
      <p class="auth-top">¿No tienes cuenta? <a class="link-accent" href="registro.html">Regístrate</a></p>
      <div>
        <h1>Iniciar sesión</h1>
        <p class="muted">Tu garaje, siempre contigo.</p>
      </div>
      <form class="form" id="form-login" action="../index.html" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-block" type="submit">Iniciar sesión</button>
      </form>
    </main>
  </div>
</body>
</html>
